<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-card">

        <h1>Employee Attendance</h1>

        <p>
            Please enter your Employee Number and PIN
        </p>

        <label>Employee Number</label>

        <input
            type="text"
            id="employeeNumber"
            placeholder="Employee Number">

        <label>PIN</label>

        <input
            type="password"
            id="pin"
            placeholder="PIN">

        <button id="checkInButton">
            Check In
        </button>

        <div id="message"></div>

        <div id="clock"></div>

    </div>

    <script src="js/employeeData.js"></script>
<script src="js/attendanceManager.js"></script>
<script src="js/deviceManager.js"></script>
<script type="module" src="js/checkin.js?v=5"></script>

</body>

</html>
